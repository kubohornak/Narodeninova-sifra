<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e101b"><title>Narodeninová šifrovačka</title><link rel="stylesheet" href="style.css"></head><body><main class="page-shell"><section class="card"><div class="gift">♧</div><div class="eyebrow" id="eyebrow"></div><h1 id="pageTitle"></h1><p class="intro" id="introText"></p><div class="progress-wrap"><div class="progress-text"><span id="progressLabel"></span><span id="progressPercent"></span></div><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div></div><div id="gameArea"><div class="image-frame"><img id="puzzleImage" alt="Šifra"></div><div class="answer-block"><div class="answer-heading"><label for="answerInput" id="answerLabel"></label><button id="hintButton" class="hint-button" type="button" aria-expanded="false" aria-label="Zobraziť nápovedu">i</button><div id="hintBubble" class="hint-bubble hidden"></div></div><div class="answer-row"><input id="answerInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Zadaj heslo..."><button id="submitButton" type="button">Enter</button></div><p class="message" id="message" aria-live="polite"></p></div></div><div id="finalArea" class="hidden"><div class="final-copy"><div class="final-kicker">HOTOVO</div><h2 id="finalTitle"></h2><p id="finalText"></p></div><div class="image-frame voucher-frame"><img id="voucherImage" alt="Narodeninová poukážka"></div><a id="downloadVoucher" class="download-button" href="#" download>Stiahnuť poukážku</a></div><button id="resetButton" class="reset-button" type="button">Začať odznova</button><p class="footer-note">Toto je len začiatok niečoho výnimočného…</p></section></main><script src="config.js"></script><script src="script.js"></script></body></html>
